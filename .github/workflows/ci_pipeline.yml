name: Tahqiq System CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out Repository Code Base
      uses: actions/checkout@v4

    - name: Set up System Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install System Framework Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install joblib scikit-learn==1.8.0 numpy pandas flake8 pytest

    - name: Code Linting Check (Syntax and Structure)
      run: |
        # Evaluates config.py, data_preprocessing.py, main.py, model_training.py, and app.py
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Unit Tests
      run: |
        pytest -v tests/
